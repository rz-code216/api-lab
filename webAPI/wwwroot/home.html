<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Users</title>
    <script src="Home.js" defer></script>
</head>
<body>

    <h1>Sign up:</h1>
    <input id="signUpEmail" type="email" placeholder="Email" />
    <br />
    <input id="signUpFirstName" type="text" placeholder="First Name" />
    <br />
    <input id="signUpLastName" type="text" placeholder="Last Name" />
    <br />
    <input id="signUpPassword" type="password" placeholder="Password" />
    <br />
    <button id="signUpButton" onclick="signUp()">Sign up</button>

    <h1>Sign in:</h1>
    <input id="signInEmail" type="email" placeholder="Email" />
    <br />
    <input id="signInPassword" type="password" placeholder="Password" />
    <br />
    <button id="signInButton" onclick="signIn()">Sign in</button>

    <a href="update.html">update your details</a>





</body>
</html>
